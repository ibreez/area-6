<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area 6 ELITE - Contact</title>

<!-- Google Fonts for Modern Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at center, #1a1a1a 0%, #0d0d0d 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 20px;
}

.card {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 40px 30px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
    width: 100%;
    max-width: 360px;
    transition: transform 0.3s ease;
}

/* Subtle hover effect for the whole card */
.card:hover {
    transform: translateY(-5px);
}

.brand-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 2px;
    color: #ffffff;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.brand-subtitle {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 4px;
    color: #d4af37; /* Premium Gold Accent */
    text-transform: uppercase;
    margin-bottom: 10px;
}

.tagline {
    font-size: 12px;
    color: #888;
    margin-bottom: 30px;
    font-weight: 400;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 14px 0;
    padding: 14px;
    border-radius: 12px;
    text-decoration: none;
    color: white;
    font-weight: 500;
    font-size: 15px;
    transition: all 0.25s ease;
    border: 1px solid transparent;
}

/* Modern Minimalist Button Styling */
.call { 
    background: rgba(46, 204, 113, 0.1); 
    color: #2ecc71;
    border-color: rgba(46, 204, 113, 0.2);
}
.call:hover { 
    background: #2ecc71; 
    color: #fff;
    box-shadow: 0 8px 20px rgba(46, 204, 113, 0.3);
}

.whatsapp { 
    background: rgba(37, 211, 102, 0.1); 
    color: #25D366;
    border-color: rgba(37, 211, 102, 0.2);
}
.whatsapp:hover { 
    background: #25D366; 
    color: #fff;
    box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
}

.viber { 
    background: rgba(115, 96, 242, 0.1); 
    color: #7360f2;
    border-color: rgba(115, 96, 242, 0.2);
}
.viber:hover { 
    background: #7360f2; 
    color: #fff;
    box-shadow: 0 8px 20px rgba(115, 96, 242, 0.3);
}
</style>
</head>

<body>

<div class="card">
    <h1 class="brand-title">Area 6</h1>
    <h2 class="brand-subtitle">Elite</h2>
    <p class="tagline">Premium Tobacco & Cigarettes</p>

    <!-- Call -->
    <a class="btn call" href="tel:+9607379902">
        <span>Call Now</span>
    </a>

    <!-- WhatsApp -->
    <a class="btn whatsapp" href="https://wa.me/9607379902" target="_blank">
        <span>WhatsApp</span>
    </a>

    <!-- Viber -->
    <a class="btn viber" href="viber://chat?number=%2B9607379902">
        <span>Viber Chat</span>
    </a>
</div>

</body>
</html>
